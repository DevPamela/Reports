version: "3.8"

services:
  reports-db-prod:
    image: mysql:8.0
    container_name: reports-db-prod
    environment:
      MYSQL_ROOT_PASSWORD: EvoaDes+
      MYSQL_USER: admin_user_api
      MYSQL_PASSWORD: EvloSEd3d5&*
      MYSQL_DATABASE: reportsdb
    ports:
      - "3307:3306"
    volumes:
      - reports-db-prod-data:/var/lib/mysql
      - ./mysql/init-prod.sql:/docker-entrypoint-initdb.d/init.sql # Script de permissões
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      reports-db-prod:
        condition: service_healthy
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=reports-db-prod;Database=reportsdb;User=admin_user_api;Password=EvloSEd3d5&*;

  nginx:
    image: nginx:latest
    container_name: nginx-reports
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  reports-db-prod-data:
